[project]
name = "frameiq"
version = "0.1.0"
description = "FrameIQ Application"
readme = "README.md"
authors = [
    { name = "manit", email = "manit17102006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "imageio-ffmpeg>=0.6.0",
    "lancedb>=0.37.1",
    "markdown>=3.10.3",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
# Yeh sirf tab download honge agar tum --extra local-ml bologe
local-ml = [
    "sentence-transformers>=5.7.0",
    "faster-whisper>=1.2.1",
]

[project.scripts]
frameiq = "frameiq:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
